name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: quant-platform
        run: |
          python -m pip install --upgrade pip
          # 仅安装测试所需轻量依赖(完整 requirements 含 GUI/Windows 包, CI 跑不动)
          pip install pytest pandas numpy || true
          # 尝试完整依赖(失败不阻断, 核心纯函数测试不依赖它们)
          pip install -r requirements.txt || true

      - name: Run regression tests
        working-directory: quant-platform
        # 回归门禁: 本次整改的核心修复(成本/复权/单位约定/step)必须常绿。
        # 注: 当前覆盖率 <6%(大量模块耦合 DuckDB/Tushare 难在 CI 跑), 不强制 --cov-fail-under,
        #     待测试基建完善后再提覆盖率门槛。
        run: |
          python -m pytest tests/ -v --tb=short
